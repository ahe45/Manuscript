<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자</title>
  <link rel="icon" href="/manuscript.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="admin-home">
    <header class="masthead masthead-with-back">
      <form action="/admin-logout" method="post">
        <button class="toolbar-button toolbar-button-gray" type="submit">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
          </svg>
          처음으로
        </button>
      </form>
      <h1>관리자</h1>
    </header>
    <nav class="workspace admin-menu" aria-label="관리자 메뉴">
      <a class="toolbar-button toolbar-button-ink" href="/setting">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-8 2v4"/>
        </svg>
        원고지 설정
      </a>
      <a class="toolbar-button toolbar-button-blue" href="/answer-downloads">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12m-5-5 5 5 5-5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>
        </svg>
        답안지 다운로드
      </a>
    </nav>
  </main>
</body>
</html>
