<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원고지 설정</title>
  <link rel="icon" href="/manuscript.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="settings">
    <header class="masthead masthead-with-back">
      <a class="masthead-back" href="/admin-home" aria-label="관리자 메뉴">
        <svg aria-hidden="true" viewBox="3 3 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7m-7 7h14"/>
        </svg>
      </a>
      <h1>원고지 설정</h1>
    </header>
    <form id="settings-form" class="workspace">
      <fieldset disabled>
        <label for="title-input">원고지 제목</label>
        <input id="title-input" name="title" type="text" maxlength="100" required
          data-help="편집기 상단과 브라우저 탭에 표시됩니다. 최대 100자까지 입력할 수 있습니다.">
        <label for="candidate-number-digits">수험번호 자리 수</label>
        <input id="candidate-number-digits" name="candidateNumberDigits" type="number" min="1" max="32" step="1" placeholder="제한 없음"
          data-help="1~32자리로 설정하면 해당 자리 수의 숫자만 사용할 수 있습니다. 비워 두면 자리 수 규칙이 적용되지 않습니다.">
        <label for="columns">한 행의 입력 칸 수</label>
        <input id="columns" name="columns" type="number" min="5" max="40" step="1" required
          data-help="5~40칸 사이에서 정할 수 있습니다. 원고지의 행은 이어서 표시됩니다.">
        <label for="question-count">문제 개수</label>
        <input id="question-count" name="questionCount" type="number" min="1" max="20" step="1" required
          data-help="문제를 1~20개까지 설정할 수 있습니다.">
        <div id="question-fields"></div>
        <div class="settings-actions">
          <button class="toolbar-button toolbar-button-ink" type="submit">설정 저장</button>
          <button class="toolbar-button toolbar-button-gray" type="submit" form="admin-logout">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
            </svg>
            처음으로
          </button>
        </div>
      </fieldset>
      <p id="save-status" role="status"></p>
    </form>
    <form id="admin-logout" action="/admin-logout" method="post" hidden></form>
  </main>
  <template id="question-fields-template">
    <fieldset>
      <div>
        <label></label>
        <input type="text" maxlength="100">
      </div>
      <div>
        <label></label>
        <input type="number" min="1" max="10000" step="1" placeholder="제한 없음">
      </div>
    </fieldset>
  </template>
  <template id="field-help-template">
    <span class="settings-help">
      <button type="button" class="settings-help-badge">
        <svg aria-hidden="true" viewBox="0 0 12 12" fill="none">
          <circle cx="6" cy="6" r="5" stroke="currentColor"/>
          <circle cx="6" cy="3.7" r=".65" fill="currentColor"/>
          <path d="M6 5.8v2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="settings-tooltip" role="tooltip"></span>
    </span>
  </template>
  <script type="module" src="/setting.js"></script>
</body>
</html>
