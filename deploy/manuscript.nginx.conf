server {
    listen 80;
    server_name manuscript.example.org;
    return 301 https://manuscript.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name manuscript.example.org;

    ssl_certificate /etc/ssl/manuscript/fullchain.pem;
    ssl_certificate_key /etc/ssl/manuscript/privkey.pem;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 140s;
    }
}
